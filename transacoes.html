<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transações - Controle Financeiro</title>
  <link rel="stylesheet" href="css/estilo.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <header>
    <h1>Controle Financeiro</h1>
    <nav aria-label="Menu principal">
      <a href="index.html">Login</a>
      <a href="cadastro.html">Cadastro</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="transacoes.html">Transações</a>
    </nav>
  </header>
  <main>
    <section aria-labelledby="titulo">
      <h2 id="titulo">Nova transação</h2>
      <form id="form-transacao" novalidate>
        <label for="descricao">Descrição</label>
        <input type="text" id="descricao" name="descricao" required>
        <label for="valor">Valor (R$)</label>
        <input type="number" id="valor" name="valor" min="0.01" step="0.01" required>
        <label for="data">Data</label>
        <input type="date" id="data" name="data" required>
        <label for="tipo">Tipo</label>
        <select id="tipo" name="tipo"><option value="receita">Receita</option><option value="despesa">Despesa</option></select>
        <label for="categoria">Categoria</label>
        <select id="categoria" name="categoria">
          <option>Alimentação</option><option>Transporte</option><option>Moradia</option>
          <option>Lazer</option><option>Saúde</option><option>Salário</option><option>Outros</option>
        </select>
        <p class="mensagem" id="mensagem" role="alert"></p>
        <button type="submit">Adicionar transação</button>
      </form>
    </section>
    <section aria-labelledby="lista-titulo">
      <h2 id="lista-titulo">Todas as transações</h2>
      <label for="filtro-tipo">Filtrar por tipo</label>
      <select id="filtro-tipo"><option value="todas">Todas</option><option value="receita">Receitas</option><option value="despesa">Despesas</option></select>
      <div class="tabela-container">
        <table>
          <caption>Transações cadastradas</caption>
          <thead><tr><th>Descrição</th><th>Valor</th><th>Data</th><th>Tipo</th><th>Categoria</th><th>Ação</th></tr></thead>
          <tbody id="tabela-transacoes"></tbody>
        </table>
      </div>
    </section>
  </main>
  <footer><p>Controle Financeiro - Desenvolvimento Web I</p></footer>
</body>
</html>
